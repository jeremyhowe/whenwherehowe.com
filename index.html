<head>

<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "fc9a92718fa048109d8885dc112b64d2"}'></script>
<title>when where howe</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap');
:root{
  color-scheme:light dark;
  --bg:#f4f5f6;
  --surface:#ffffff;
  --bed:#101214;
  --bed-cell:#1e2225;
  --ink:#16181a;
  --ink-2:#3a4045;
  --muted:#5c656b;
  --line:#dcdfe2;
  --line-strong:#c3c8cd;
  --accent:#8f2d34;
  --accent-ink:#ffffff;

  --serif:'EB Garamond',Georgia,'Times New Roman',serif;
  --sans:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',ui-sans-serif,system-ui,sans-serif;

  /* Modular scale, 1.25. Headings are fluid; body sizes are not, because
     prose that resizes with the viewport is prose you can't settle into. */
  --t-xs:0.8125rem;   /* 13px — captions, play times */
  --t-sm:0.9375rem;   /* 15px — labels, nav, metadata */
  --t-base:1.0625rem; /* 17px — UI body */
  --t-prose:1.1875rem;/* 19px — essay body */
  --t-lg:1.375rem;
  --t-xl:clamp(1.5rem,1.1rem + 1.6vw,2rem);
  --t-2xl:clamp(2rem,1.4rem + 2.6vw,3rem);

  --measure:34rem;      /* prose column, lands at ~68ch in EB Garamond */
  --page-w:41rem;
  --page-w-wide:72rem;  /* the exhibit needs the room */

  --s-1:0.375rem; --s-2:0.75rem; --s-3:1.25rem; --s-4:2rem;
  --s-5:3rem;     --s-6:4.5rem;  --s-7:7rem;

  --radius:3px;
  --shadow-object:0 1px 2px rgba(16,18,20,0.10),0 8px 22px -8px rgba(16,18,20,0.22);
  --shadow-pop:0 2px 6px rgba(16,18,20,0.10),0 16px 40px -12px rgba(16,18,20,0.35);

  /* One easing for the whole site. Exponential ease-out: fast departure,
     long settle. No bounce anywhere. */
  --ease:cubic-bezier(0.22,1,0.36,1);
  --dur:220ms;

  --z-tip:20;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#121415;
    --surface:#1a1d1f;
    --bed:#000000;
    --bed-cell:#16191b;
    --ink:#eceef0;
    --ink-2:#c3c9cd;
    --muted:#98a1a7;
    --line:#2b3033;
    --line-strong:#3c4347;
    --accent:#e59aa0;
    --accent-ink:#16181a;
    --shadow-object:0 1px 2px rgba(0,0,0,0.5),0 8px 22px -8px rgba(0,0,0,0.7);
    --shadow-pop:0 2px 6px rgba(0,0,0,0.5),0 16px 40px -12px rgba(0,0,0,0.8);
  }
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{background:var(--bg);color:var(--ink);font-family:var(--serif);
  font-size:var(--t-base);line-height:1.6;-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;}
.page{max-width:var(--page-w);margin:0 auto;padding:var(--s-4) var(--s-3) var(--s-7);}
.page--wide{max-width:var(--page-w-wide);}
img{max-width:100%;display:block;}

a{color:inherit;}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px;}

/* Every label, date, caption and control on the site. The old system set
   these at 10-11px, uppercase, 0.1em tracked, in #aaa — four separate
   legibility taxes stacked on the same text. This is the whole replacement:
   normal case, real size, a color that passes. */
.meta{font-family:var(--sans);font-size:var(--t-sm);line-height:1.45;
  color:var(--muted);letter-spacing:0;}
.meta--xs{font-size:var(--t-xs);}

.prose{font-family:var(--serif);font-size:var(--t-prose);line-height:1.75;
  color:var(--ink);max-width:var(--measure);text-wrap:pretty;}
.prose p{margin-bottom:1.5em;}
.prose p:last-child{margin-bottom:0;}
.prose a{color:var(--accent);text-decoration:underline;
  text-underline-offset:0.18em;text-decoration-thickness:from-font;}
.prose em{font-style:italic;}

h1,h2,h3{font-weight:400;line-height:1.15;text-wrap:balance;letter-spacing:-0.012em;}
.title{font-family:var(--serif);font-size:var(--t-2xl);color:var(--ink);}
.title-sm{font-family:var(--serif);font-size:var(--t-xl);color:var(--ink);}

.rule{border:none;border-top:1px solid var(--line);
  margin:var(--s-3) 0 var(--s-4);}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:0.01ms !important;
    animation-iteration-count:1 !important;transition-duration:0.01ms !important;
    scroll-behavior:auto !important;}
}
.site-head{display:flex;flex-wrap:wrap;align-items:baseline;
  gap:var(--s-2) var(--s-4);margin-bottom:var(--s-5);}
/* The wordmark was 11px of #aaa — 2.19:1, and smaller than the dates under
   it. It's the name of the site; it can be the size of the name of the
   site. Tracking is mild (0.06em, not 0.2em) so it reads as a word. */
.wordmark{font-family:var(--sans);font-size:var(--t-base);font-weight:700;
  letter-spacing:0.06em;color:var(--ink);text-decoration:none;
  white-space:nowrap;}
.wordmark:hover{color:var(--accent);}

.site-nav{font-family:var(--sans);font-size:var(--t-sm);display:flex;
  flex-wrap:wrap;gap:var(--s-2) var(--s-3);}
.site-nav a{color:var(--muted);text-decoration:none;
  padding-bottom:2px;border-bottom:1px solid transparent;
  transition:color var(--dur) var(--ease),border-color var(--dur) var(--ease);}
.site-nav a:hover{color:var(--ink);border-bottom-color:var(--line-strong);}
/* The room you're standing in, marked once and quietly. */
.site-nav a[aria-current="page"]{color:var(--ink);
  border-bottom-color:var(--accent);}

/* Home doesn't repeat the nav at the top — the three objects are the way in.
   Everything still has to be reachable, and the fourth room won't have an
   object on the shelf, so the full index lives at the foot of the page. */
.site-foot{margin-top:var(--s-6);padding-top:var(--s-3);
  border-top:1px solid var(--line);}
.site-foot .site-nav{gap:var(--s-2) var(--s-3);}
/* The homepage doesn't repeat the nav above the shelf. The three objects
   are the way into the three rooms, and printing the same three words
   directly above them was the site saying everything twice. The full index
   is in the footer, which is also where the fourth room will land. */
/* Three objects on one surface.

   The old version was a three-up card grid: identical frames, identical
   sizes, and `aspect-ratio:1/1;object-fit:cover` on all three — which meant
   the book was cropped square to match the records. The Book of Delights
   lost the bottom of its own cover, author's name included, so the row
   would line up.

   That crop was the actual incoherence, not the pixel art. Three objects of
   different kinds only read as a mistake when the layout insists they're the
   same kind of thing. So: nothing matches. The book is a book (2:3,
   uncropped, with a spine edge), the records are records (square, pixel).
   What makes them a set is the setting — one surface, one light, one caption
   voice, and sizes chosen rather than divided.

   Sizes are set by HEIGHT, not width, so each object keeps its own aspect
   ratio and they still stand on a common line. The clamp lets the whole
   still life shrink together on a phone instead of collapsing into a
   stack. */
/* minmax(0,max-content), not bare max-content: the captions are allowed up
   to 16rem, and a bare max-content track sizes the column to that even when
   the viewport can't afford it — which pushed the third object off the right
   edge of a phone. The minmax lets the columns shrink below their captions'
   ideal width and wrap the text instead. */
.shelf{display:grid;grid-template-columns:repeat(3,minmax(0,max-content));
  grid-template-rows:auto auto;align-items:end;justify-content:space-between;
  max-width:100%;gap:var(--s-2) clamp(0.9rem,4vw,2rem);
  margin-bottom:0;}
/* subgrid is what puts every caption on one line even though the objects
   above them are different heights. */
.object{grid-row:span 2;display:grid;grid-template-rows:subgrid;row-gap:var(--s-2);
  text-decoration:none;color:inherit;min-width:0;}
.object-art{align-self:end;display:block;position:relative;}
.object-art img{height:var(--h);width:auto;display:block;border-radius:var(--radius);
  background:var(--line);box-shadow:var(--shadow-object);
  transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease);}
.object-art .no-art{height:var(--h);width:calc(var(--h) * var(--ar,1));
  border-radius:var(--radius);background:var(--line);box-shadow:var(--shadow-object);}
.object-art img.pixel{image-rendering:pixelated;}
/* Representational, not decoration: the shadow a book's own spine casts
   across its front board. Only the book gets it. */
.object--book .object-art img{box-shadow:var(--shadow-object),
  inset 7px 0 9px -7px rgba(16,18,20,0.45);}
/* One height for all three. An earlier draft staged them at three different
   sizes, which looked composed but asserted a hierarchy the site doesn't
   have — there's no reason the record on the turntable outranks the book in
   your hand. Equal height, each keeping its own aspect ratio, so the book is
   still visibly a book and the records are still records. */
.object--reading{--h:clamp(6.5rem,26vw,11rem);--ar:0.667;}
.object--playing{--h:clamp(6.5rem,26vw,11rem);--ar:1;}
.object--reflection{--h:clamp(6.5rem,26vw,11rem);--ar:1;}

.object-cap{align-self:start;display:block;max-width:16rem;}
.object-label{display:block;font-family:var(--sans);font-size:var(--t-xs);
  color:var(--muted);margin-bottom:0.15rem;}
.object-title{display:block;font-family:var(--serif);font-size:var(--t-base);
  line-height:1.25;color:var(--ink);}
.object-by{display:block;font-family:var(--serif);font-style:italic;
  font-size:var(--t-base);line-height:1.25;color:var(--ink-2);}

.object:hover img{transform:translateY(-3px);box-shadow:var(--shadow-pop);}
.object--book:hover .object-art img{box-shadow:var(--shadow-pop),
  inset 7px 0 9px -7px rgba(16,18,20,0.45);}
.object:hover .object-title{color:var(--accent);}
.object:focus-visible{outline:none;}
.object:focus-visible .object-art img{outline:2px solid var(--accent);outline-offset:4px;}

@media (max-width:40rem){
  .shelf{gap:var(--s-2) 0.85rem;justify-content:start;}
  .object-cap{max-width:100%;}
  .object-title,.object-by{font-size:var(--t-sm);}
}
.post-list{list-style:none;max-width:var(--measure);}
.post-item{display:flex;align-items:baseline;justify-content:space-between;
  gap:var(--s-3);padding:var(--s-2) 0;border-bottom:1px solid var(--line);}
.post-item:first-child{border-top:1px solid var(--line);}
.post-title{font-family:var(--serif);font-size:var(--t-base);color:var(--ink);
  text-decoration:none;line-height:1.35;}
.post-title:hover{color:var(--accent);}
.post-date{white-space:nowrap;flex-shrink:0;}
</style>
