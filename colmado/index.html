<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1B3A6B" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1116" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Colmado">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png" sizes="192x192">
<title>Colmado — Prototipo de interfaz</title>

<style>
  :root {
    --ground:      #F2F4F7;
    --surface:     #FFFFFF;
    --surface-2:   #E9ECF2;
    --line:        #BCC5D4;
    --line-strong: #818EA2;
    --ink:         #171A21;
    --ink-2:       #4A5364;
    --ink-3:       #545E70;
    --brand:       #1B3A6B;
    --brand-soft:  #E3EAF5;
    --credit:      #855610;
    --credit-soft: #FBF0DA;
    --ok:          #15613F;
    --warn:        #A55A08;
    --crit:        #A32A2A;
    --crit-soft:   #FBE7E7;
    --shadow: 0 1px 2px rgba(16,22,38,.06), 0 8px 24px rgba(16,22,38,.08);
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground:      #0E1116;
      --surface:     #171B23;
      --surface-2:   #202632;
      --line:        #3A4250;
      --line-strong: #596473;
      --ink:         #EDF0F5;
      --ink-2:       #A9B3C2;
      --ink-3:       #9AA6B4;
      --brand:       #7DA6E8;
      --brand-soft:  #1B2536;
      --credit:      #E0AC53;
      --credit-soft: #2A2113;
      --ok:          #5BC08D;
      --warn:        #E0A055;
      --crit:        #E88A8A;
      --crit-soft:   #2E1A1A;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="light"] {
    --ground:#F2F4F7; --surface:#FFFFFF; --surface-2:#E9ECF2; --line:#BCC5D4;
    --line-strong:#818EA2; --ink:#171A21; --ink-2:#4A5364; --ink-3:#545E70;
    --brand:#1B3A6B; --brand-soft:#E3EAF5; --credit:#855610; --credit-soft:#FBF0DA;
    --ok:#15613F; --warn:#A55A08; --crit:#A32A2A; --crit-soft:#FBE7E7;
    --shadow:0 1px 2px rgba(16,22,38,.06), 0 8px 24px rgba(16,22,38,.08);
  }
  :root[data-theme="dark"] {
    --ground:#0E1116; --surface:#171B23; --surface-2:#202632; --line:#3A4250;
    --line-strong:#596473; --ink:#EDF0F5; --ink-2:#A9B3C2; --ink-3:#9AA6B4;
    --brand:#7DA6E8; --brand-soft:#1B2536; --credit:#E0AC53; --credit-soft:#2A2113;
    --ok:#5BC08D; --warn:#E0A055; --crit:#E88A8A; --crit-soft:#2E1A1A;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }
  /* Double-tapping + or - must not zoom the page. touch-action:manipulation
     disables the double-tap-to-zoom gesture (and its 300ms wait) while LEAVING
     pinch-to-zoom intact — so a volunteer who needs bigger text still has it.
     Deliberately not using maximum-scale/user-scalable=no, which would take
     zoom away from exactly the people most likely to need it. */
  button, .pcard, .stepper, .qty {
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--sans); font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .tnum { font-variant-numeric: tabular-nums; }

  /* ---------- page chrome ---------- */
  .page { max-width: 1180px; margin: 0 auto; padding: 32px 20px 80px; }
  header.masthead { display: flex; flex-wrap: wrap; gap: 16px 28px; align-items: baseline;
    border-bottom: 1px solid var(--line); padding-bottom: 20px; margin-bottom: 28px; }
  .masthead h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
  .masthead p { margin: 0; color: var(--ink-2); font-size: 14px; max-width: 60ch; }
  .eyebrow { font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-3); font-weight: 600; }

  .workbench { display: grid; grid-template-columns: minmax(0,1fr) 320px; gap: 40px; align-items: start; }
  @media (max-width: 900px) { .workbench { grid-template-columns: 1fr; } }

  .stage { display: flex; flex-direction: column; align-items: center; gap: 20px; }

  /* ---------- screen switcher ---------- */
  .switcher { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .switcher button {
    font: inherit; font-size: 12.5px; padding: 6px 11px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
    cursor: pointer; transition: background .12s, color .12s, border-color .12s;
  }
  .switcher button:hover { border-color: var(--line-strong); color: var(--ink); }
  .switcher button[aria-current="true"] {
    background: var(--brand); border-color: var(--brand); color: var(--surface); font-weight: 600;
  }
  :root[data-theme="dark"] .switcher button[aria-current="true"],
  @media (prefers-color-scheme: dark) { }
  .switcher button:focus-visible, .phone button:focus-visible, .toggles button:focus-visible {
    outline: 2px solid var(--brand); outline-offset: 2px;
  }

  /* ---------- phone ---------- */
  .phone {
    width: 390px; max-width: 100%; background: var(--surface);
    border: 1px solid var(--line); border-radius: 26px; box-shadow: var(--shadow);
    overflow: hidden; display: flex; flex-direction: column;
    min-height: 720px;
  }
  .phone .statusbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 18px 5px; font-size: 11px; color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }
  .appbar {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--surface);
  }
  .appbar .who { font-size: 13.5px; font-weight: 600; letter-spacing: -.005em; }
  .appbar .who span { font-weight: 400; color: var(--ink-3); }
  /* min-height:0 is load-bearing. A flex item defaults to min-height:auto, which
     refuses to shrink below its content — so a long product list pushes .foot
     off the bottom of the phone instead of scrolling inside it. */
  .screenbody { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .foot { flex: none; }

  .banner {
    display: flex; align-items: center; gap: 8px; padding: 8px 16px;
    font-size: 12.5px; font-weight: 600;
    background: var(--crit-soft); color: var(--crit);
    border-bottom: 1px solid var(--line);
  }
  .banner .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }

  .sect { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .sect-label { font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink-3); font-weight: 600; margin-bottom: 8px; }

  input[type="text"], input[type="number"] {
    font: inherit; width: 100%; padding: 11px 12px; border-radius: 10px;
    border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--ink);
  }
  input:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; border-color: var(--brand); }

  .result {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 10px 12px; margin-top: 6px; border-radius: 10px; cursor: pointer;
    border: 1px solid transparent; background: var(--surface-2); font-size: 14px;
  }
  .result:hover { border-color: var(--line-strong); }
  .result .ced { color: var(--ink-3); font-size: 13px; }
  .chosen {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 11px 12px; border-radius: 10px; background: var(--brand-soft);
    border: 1px solid color-mix(in srgb, var(--brand) 30%, transparent); font-size: 14.5px;
  }
  .chosen b { font-weight: 600; }
  .chosen .swap { font-size: 12px; color: var(--brand); background: none; border: 0;
    font-family: inherit; cursor: pointer; text-decoration: underline; padding: 0; }

  /* product rows */
  .prow {
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px;
    padding: 9px 16px; border-bottom: 1px solid var(--line);
  }
  .prow:last-child { border-bottom: 0; }
  .prow.active { background: var(--brand-soft); }
  .pname { font-size: 15px; letter-spacing: -.005em; }
  /* The dot is the actual identifier for these three — the word is the caption.
     Sized to be matchable against a bag held in the hand, not a bullet point. */
  .swatch {
    display: inline-block; width: 22px; height: 22px; border-radius: 50%;
    margin-right: 9px; vertical-align: -5px;
    box-shadow: 0 0 0 1px rgba(0,0,0,.25) inset, 0 0 0 2px var(--surface);
  }
  .punit { font-size: 11.5px; color: var(--ink-3); text-transform: lowercase; }
  .stepper { display: flex; align-items: center; gap: 4px; }
  .stepper button {
    width: 34px; height: 34px; border-radius: 9px; font: inherit; font-size: 18px; line-height: 1;
    border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
    cursor: pointer; display: grid; place-items: center;
  }
  .stepper button:hover { background: var(--surface-2); }
  .stepper button:disabled { opacity: .35; cursor: default; }
  .stepper .qty { min-width: 42px; text-align: center; font-size: 16px; font-weight: 600;
    font-variant-numeric: tabular-nums; }
  .stepper input.dec {
    width: 62px; text-align: center; padding: 7px 4px; font-size: 15px; font-weight: 600;
    border-radius: 9px; font-variant-numeric: tabular-nums;
  }
  .grupo {
    padding: 14px 16px 6px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink-3); font-weight: 600; border-top: 1px solid var(--line);
    background: var(--surface-2);
  }
  .vertodos {
    width: 100%; padding: 13px; font: inherit; font-size: 14px; font-weight: 600;
    background: none; border: 0; border-top: 1px solid var(--line);
    color: var(--brand); cursor: pointer;
  }
  .vertodos:hover { background: var(--surface-2); }

  /* totals + primary action */
  .foot { border-top: 1px solid var(--line-strong); background: var(--surface); padding: 12px 16px 16px; }
  .totalrow { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .totalrow .lbl { font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink-3); font-weight: 600; }
  .totalrow .amt { font-size: 30px; font-weight: 650; letter-spacing: -.02em;
    font-variant-numeric: tabular-nums; }
  .approx { font-size: 11px; color: var(--warn); font-weight: 600; }

  .btn {
    width: 100%; padding: 15px; font: inherit; font-size: 17px; font-weight: 650;
    border-radius: 13px; border: 0; cursor: pointer; letter-spacing: .01em;
    background: var(--brand); color: #fff;
  }
  :root[data-theme="dark"] .btn { color: #0E1116; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn { color: #0E1116; } }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.ghost { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line-strong); }
  .btn.danger { background: var(--crit-soft); color: var(--crit); border: 1px solid color-mix(in srgb, var(--crit) 35%, transparent); }
  .btnrow { display: flex; gap: 10px; }
  .btnrow .btn { font-size: 15px; }

  /* confirm list */
  .cline {
    display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: baseline;
    padding: 9px 16px; font-size: 14.5px; border-bottom: 1px solid var(--line);
  }
  .cline .qty { color: var(--ink-2); font-size: 13px; font-variant-numeric: tabular-nums; }
  .cline .calc { color: var(--ink-3); font-size: 12.5px; font-variant-numeric: tabular-nums;
    font-family: var(--mono); }
  .cline .sub { font-weight: 600; font-variant-numeric: tabular-nums; min-width: 62px; text-align: right; }

  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; font-size: 14.5px; }
  .kv .k { color: var(--ink-2); }
  .kv .v { font-variant-numeric: tabular-nums; font-weight: 600; }
  .kv.big .v { font-size: 20px; }
  .kv.quiet .k, .kv.quiet .v { color: var(--ink-3); font-weight: 400; }

  /* receipt */
  .stamp { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 26px 16px 18px; }
  .stamp .check {
    width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center;
    background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok);
    font-size: 24px; font-weight: 700;
  }
  .stamp .t { font-size: 17px; font-weight: 650; letter-spacing: .01em; }

  .creditbox {
    margin: 0 16px 14px; padding: 14px 16px; border-radius: 13px;
    background: var(--credit-soft); border: 1px solid color-mix(in srgb, var(--credit) 32%, transparent);
  }
  .creditbox .arith { font-family: var(--mono); font-size: 13px; color: var(--ink-2);
    display: flex; flex-direction: column; gap: 5px; }
  .creditbox .arith div { display: flex; justify-content: space-between; gap: 10px; }
  .creditbox .arith b { color: var(--ink); font-weight: 600; }
  .creditbox hr { border: 0; border-top: 1px solid color-mix(in srgb, var(--credit) 30%, transparent); margin: 11px 0; }
  .creditbox .total { display: flex; justify-content: space-between; align-items: baseline; }
  .creditbox .total .k { font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase;
    font-weight: 700; color: var(--credit); }
  .creditbox .total .v { font-size: 25px; font-weight: 650; color: var(--credit);
    font-variant-numeric: tabular-nums; }
  .creditbox .next { margin-top: 8px; font-size: 13px; color: var(--ink-2); }
  .earned-pill {
    display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px;
    background: var(--credit); color: var(--surface); font-size: 12px; font-weight: 700;
  }
  :root[data-theme="dark"] .earned-pill { color: #17130A; }

  /* meter */
  .meter { height: 7px; border-radius: 999px; background: color-mix(in srgb, var(--credit) 22%, transparent);
    overflow: hidden; margin-top: 10px; }
  .meter i { display: block; height: 100%; background: var(--credit); border-radius: 999px;
    transition: width .5s cubic-bezier(.2,.7,.3,1); }

  /* variance */
  .variance {
    display: flex; justify-content: space-between; align-items: baseline; padding: 13px 14px;
    border-radius: 12px; font-size: 15px; margin-top: 4px;
  }
  .variance.zero { background: color-mix(in srgb, var(--ok) 13%, transparent); color: var(--ok); }
  .variance.off  { background: var(--crit-soft); color: var(--crit); }
  .variance .v { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }

  .fijo {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 0 2px 12px; margin-bottom: 12px; border-bottom: 1px solid var(--line);
  }
  .fijo .k { font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase;
    font-weight: 700; color: var(--ink-3); }
  .fijo .v { font-size: 26px; font-weight: 650; letter-spacing: -.02em;
    font-variant-numeric: tabular-nums; }

  .note { padding: 10px 16px 16px; font-size: 12.5px; color: var(--ink-3); }

  /* ---------- annotations ---------- */
  .notes { position: sticky; top: 24px; display: flex; flex-direction: column; gap: 14px; }
  .notecard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .notecard h3 { margin: 0 0 8px; font-size: 13px; letter-spacing: -.005em; }
  .notecard ul { margin: 0; padding-left: 16px; display: flex; flex-direction: column; gap: 7px; }
  .notecard li { font-size: 13px; color: var(--ink-2); line-height: 1.45; }
  .notecard code { font-family: var(--mono); font-size: 11.5px; background: var(--surface-2);
    padding: 1px 4px; border-radius: 4px; color: var(--ink); }
  .ref { font-size: 11px; color: var(--ink-3); font-weight: 600; }

  .toggles { display: flex; flex-wrap: wrap; gap: 8px; }
  .toggles button {
    font: inherit; font-size: 12.5px; padding: 7px 12px; border-radius: 9px; cursor: pointer;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
  }
  .toggles button[aria-pressed="true"] { background: var(--crit-soft); color: var(--crit);
    border-color: color-mix(in srgb, var(--crit) 35%, transparent); font-weight: 600; }

  /* day list — the default way to pick a patient: no typing */
  .daylist { display: flex; flex-direction: column; gap: 7px; }
  .pcard {
    display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
    padding: 12px 13px; border-radius: 12px; cursor: pointer; font: inherit;
    border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  }
  .pcard:hover { border-color: var(--brand); background: var(--brand-soft); }
  .pcard .ini {
    width: 40px; height: 40px; border-radius: 50%; flex: none; display: grid; place-items: center;
    background: var(--brand-soft); color: var(--brand); font-weight: 700; font-size: 15px;
    border: 1px solid color-mix(in srgb, var(--brand) 28%, transparent);
  }
  .pcard .nm { font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
  .pcard .sub { font-size: 12px; color: var(--ink-3); }
  .pcard.sel { border-color: var(--brand); background: var(--brand-soft); }
  .pcard.done { opacity: .5; }
  /* Dimmed and ticked, never struck through — they may well come back for a
     second purchase, so the row has to stay readable and tappable. */
  .pcard.done { opacity: .62; }
  .pcard .tick { margin-left: auto; color: var(--ok); font-weight: 700; }
  .listhead { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 9px; }
  .listhead .count { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .donacion { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .donacion button {
    font: inherit; font-size: calc(var(--esc) * 17px); font-weight: 600;
    padding: 12px 14px; border-radius: 11px; cursor: pointer;
    border: 1px solid color-mix(in srgb, var(--credit) 40%, transparent);
    background: var(--credit-soft); color: var(--credit);
  }
  .donacion button.quitar { background: none; border-color: var(--line-strong); color: var(--ink-2); }
  .donacion input.qtyin { width: calc(var(--esc) * 86px); flex: none; }

  .hoja {
    position: absolute; inset: 0; z-index: 30; background: var(--surface);
    display: flex; flex-direction: column;
  }
  .hoja-top { padding: 16px; border-bottom: 1px solid var(--line); }
  .hoja-cuerpo { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px; }
  .phone { position: relative; }

  .searchtoggle {
    width: 100%; margin-top: 10px; padding: 11px; font: inherit; font-size: 13.5px;
    background: none; border: 1px dashed var(--line-strong); border-radius: 10px;
    color: var(--ink-2); cursor: pointer;
  }
  .searchtoggle:hover { border-color: var(--brand); color: var(--brand); }


  /* change to give, broken into notes */
  .devolver {
    margin: 12px 0 0; padding: 14px 16px; border-radius: 13px;
    background: color-mix(in srgb, var(--ok) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--ok) 30%, transparent);
  }
  .devolver .top { display: flex; justify-content: space-between; align-items: baseline; }
  .devolver .k { font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase;
    font-weight: 700; color: var(--ok); }
  .devolver .v { font-size: 34px; font-weight: 650; color: var(--ok);
    font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .notes-give { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .bill {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 8px;
    background: var(--surface); border: 1px solid color-mix(in srgb, var(--ok) 30%, transparent);
    font-size: 13.5px; font-variant-numeric: tabular-nums;
  }
  .bill b { font-weight: 700; }

  /* denomination counter */
  .denoms { display: flex; flex-direction: column; gap: 8px; }
  .denom { display: grid; grid-template-columns: 58px 1fr auto; align-items: center; gap: 8px; }
  .denom .face { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .denom .sum { font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums;
    text-align: right; min-width: 62px; }
  .denom .stepper { justify-content: flex-end; gap: 6px; }
  /* One height for the whole row, so the ± squares match the field exactly. */
  .denom { --alto: 46px; }
  .denom .stepper button {
    flex: 0 0 var(--alto);
    width: var(--alto); height: var(--alto);
    background: var(--brand-soft); border-color: color-mix(in srgb, var(--brand) 34%, transparent);
    color: var(--brand); font-weight: 600;
  }
  .denom .stepper button:hover:not(:disabled) {
    background: color-mix(in srgb, var(--brand) 18%, var(--brand-soft));
  }
  .denom .stepper button:disabled { background: var(--surface-2); color: var(--ink-3); }
  input.qtyin {
    flex: 0 0 var(--alto, 46px);
    width: var(--alto, 46px); height: var(--alto, 46px); min-width: 0;
    text-align: center; font: inherit; font-size: 17px; font-weight: 600;
    padding: 0; border-radius: 10px; border: 1px solid var(--line-strong);
    background: var(--surface); color: var(--ink);
  }

  /* App mode: installed to the home screen, or ?app=1. The volunteer sees the
     till and nothing else — no annotations, no screen switcher, no page. */
  body.appmode { background: var(--surface); }
  body.appmode .page { max-width: none; padding: 0; }
  body.appmode .masthead,
  body.appmode .switcher,
  body.appmode .notes,
  body.appmode .toggles { display: none; }
  body.appmode .workbench { display: block; }
  body.appmode .stage { gap: 0; }
  /* Height, in order of preference:
       --alto-app  measured from the browser itself (see JS) — always correct;
       100svh      the small viewport, i.e. with the address bar showing;
       100vh       last resort. On mobile this EXCLUDES the address bar, so the
                   footer ends up underneath it — which is exactly the bug this
                   chain exists to avoid when svh is unsupported. */
  body.appmode .phone {
    width: 100%; max-width: none; border: 0; border-radius: 0; box-shadow: none;
    min-height: 0;   /* the review-page mock is 720px tall; a real phone is not */
    height: 100vh;
    height: 100svh;
    height: var(--alto-app, 100svh);
  }
  body.appmode, body.appmode .workbench, body.appmode .stage {
    height: 100vh;
    height: 100svh;
    height: var(--alto-app, 100svh);
    overflow: hidden;
  }
  body.appmode .phone .statusbar { display: none; }
  body.appmode .appbar { padding-top: max(10px, env(safe-area-inset-top)); }
  body.appmode .foot { padding-bottom: max(16px, env(safe-area-inset-bottom)); }
  /* Thumbs, not cursors: everything tappable gets bigger in the real app. */
  body.appmode .btn { padding: 18px; font-size: 18px; }
  body.appmode .stepper button { width: 52px; height: 52px; font-size: 24px; border-radius: 12px; }
  body.appmode .swatch { width: 28px; height: 28px; margin-right: 11px; vertical-align: -7px; }
  body.appmode .denom { --alto: 56px; gap: 10px; }
  body.appmode .denom .stepper button {
    flex: 0 0 var(--alto); width: var(--alto); height: var(--alto);
    border-radius: 13px; font-size: 26px;
  }
  body.appmode input.qtyin { font-size: 20px; border-radius: 13px; }
  body.appmode .pcard { padding: 15px 14px; }
  body.appmode .pcard .nm { font-size: 17px; }

  /* ---------- Legibilidad ----------
     Written for volunteers with presbyopia and no reading glasses to hand.
     The governing fact: someone who cannot focus close holds the phone at
     arm's length, so type must survive ~55cm rather than the ~30cm phones
     assume. Everything below is sized for that distance, and --esc lets a
     volunteer push it further still. Small grey captions are gone entirely —
     they were the least readable thing on the screen and carried real
     information (units, patient id, credit). */
  :root { --esc: 1; }
  :root[data-texto="grande"] { --esc: 1.2; }

  body { font-size: calc(var(--esc) * 17px); line-height: 1.5; }

  .pname            { font-size: calc(var(--esc) * 20px); font-weight: 600; }
  .punit            { font-size: calc(var(--esc) * 15px); color: var(--ink-2);
                      text-transform: none; font-weight: 500; }
  .sect-label       { font-size: calc(var(--esc) * 15px); color: var(--ink-2);
                      text-transform: none; letter-spacing: 0; font-weight: 600; }
  .listhead .count  { font-size: calc(var(--esc) * 14px); color: var(--ink-2); }
  .pcard .nm        { font-size: calc(var(--esc) * 20px); }
  .pcard .sub       { font-size: calc(var(--esc) * 15px); color: var(--ink-2); }
  .pcard .ini       { font-size: calc(var(--esc) * 16px); }
  .result           { font-size: calc(var(--esc) * 18px); }
  .result .ced      { font-size: calc(var(--esc) * 16px); color: var(--ink-2); }
  .chosen           { font-size: calc(var(--esc) * 18px); }
  .cline            { font-size: calc(var(--esc) * 18px); }
  .cline .qty       { font-size: calc(var(--esc) * 16px); color: var(--ink-2); }
  .cline .calc      { font-size: calc(var(--esc) * 16px); color: var(--ink-2); }
  .cline .sub       { font-size: calc(var(--esc) * 18px); min-width: 76px; }
  .kv               { font-size: calc(var(--esc) * 18px); }
  .kv.big .v        { font-size: calc(var(--esc) * 24px); }
  .kv .k            { color: var(--ink-2); }
  .kv.quiet .k, .kv.quiet .v { color: var(--ink-2); }
  .totalrow .lbl    { font-size: calc(var(--esc) * 14px); color: var(--ink-2); }
  .totalrow .amt    { font-size: calc(var(--esc) * 36px); }
  .btn              { font-size: calc(var(--esc) * 20px); }
  .btnrow .btn      { font-size: calc(var(--esc) * 18px); }
  .denom .face      { font-size: calc(var(--esc) * 20px); }
  .denom .sum       { font-size: calc(var(--esc) * 16px); color: var(--ink-2); min-width: 78px; }
  .stepper .qty     { font-size: calc(var(--esc) * 20px); }
  input.qtyin       { font-size: calc(var(--esc) * 21px); }
  .fijo .k          { font-size: calc(var(--esc) * 14px); color: var(--ink-2); }
  .fijo .v          { font-size: calc(var(--esc) * 30px); }
  .note             { font-size: calc(var(--esc) * 15px); color: var(--ink-2); }
  .banner           { font-size: calc(var(--esc) * 15px); }
  .appbar .who      { font-size: calc(var(--esc) * 16px); }
  .stamp .t         { font-size: calc(var(--esc) * 20px); }
  .creditbox .arith { font-size: calc(var(--esc) * 17px); }
  .creditbox .total .k { font-size: calc(var(--esc) * 14px); }
  .creditbox .total .v { font-size: calc(var(--esc) * 30px); }
  .creditbox .next  { font-size: calc(var(--esc) * 16px); color: var(--ink-2); }
  .devolver .k      { font-size: calc(var(--esc) * 14px); }
  .devolver .v      { font-size: calc(var(--esc) * 38px); }
  .bill             { font-size: calc(var(--esc) * 17px); }
  .variance         { font-size: calc(var(--esc) * 18px); }
  .variance .v      { font-size: calc(var(--esc) * 24px); }
  .earned-pill      { font-size: calc(var(--esc) * 15px); }
  .grupo            { font-size: calc(var(--esc) * 14px); }
  .searchtoggle     { font-size: calc(var(--esc) * 16px); color: var(--ink-2); }
  input[type="text"] { font-size: calc(var(--esc) * 18px); }

  /* Rows need to be separable at arm's length, so dividers get real weight. */
  .prow, .denom + .denom { border-color: var(--line); }
  .prow { border-bottom-width: 1px; padding-top: 13px; padding-bottom: 13px; }

  /* These must out-specify the earlier body.appmode rules, or they lose. */
  body.appmode .btn { font-size: calc(var(--esc) * 21px); padding: calc(var(--esc) * 19px); }
  body.appmode .btnrow .btn { font-size: calc(var(--esc) * 18px); }
  body.appmode input.qtyin { font-size: calc(var(--esc) * 22px); }
  body.appmode .pcard .nm { font-size: calc(var(--esc) * 21px); }
  body.appmode .appbar .who { font-size: calc(var(--esc) * 17px); }

  /* Bigger targets again once the type grows. */
  body.appmode .denom { --alto: calc(var(--esc) * 58px); }
  body.appmode .stepper button {
    width: calc(var(--esc) * 54px); height: calc(var(--esc) * 54px);
  }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<body>
<div class="page">
  <header class="masthead">
    <div style="flex:1 1 320px">
      <div class="eyebrow">CCI · Comedero &amp; Sabana Rey</div>
      <h1>Colmado — prototipo de interfaz</h1>
    </div>
    <p>Clickable prototype of the <code>venta</code> and <code>recepción</code> flows from the build spec.
       The credit arithmetic is the real §6.1 algorithm, so the numbers respond honestly as you ring up a sale.</p>
  </header>

  <div class="workbench">
    <div class="stage">
      <nav class="switcher" id="switcher" aria-label="Pantallas"></nav>

      <div class="phone" lang="es">
        <div class="statusbar">
          <span id="clock">9:41</span>
          <span id="netlabel">wifi · 89%</span>
        </div>
        <div class="appbar">
          <div class="who" id="appbar-who">Comedero · Roselio</div>
          <button class="swap" id="appbar-action" style="font-size:13px;background:none;border:0;color:var(--brand);font-family:inherit;cursor:pointer">Cerrar</button>
        </div>
        <div class="screenbody" id="screenbody"></div>
      </div>

      <div class="toggles">
        <button id="tg-offline" aria-pressed="false">Simular corte de energía</button>
        <button id="tg-reset" aria-pressed="false">Reiniciar venta</button>
      </div>
    </div>

    <aside class="notes" id="notes"></aside>
  </div>
</div>

<script>
(function () {
  "use strict";

  // Installed to the home screen, or ?app=1 for testing in a browser tab.
  const enApp = window.matchMedia("(display-mode: standalone)").matches
             || window.navigator.standalone === true
             || new URLSearchParams(location.search).has("app");
  if (enApp) document.body.classList.add("appmode");

  // Browser chrome on a phone is not a fixed height — it appears, hides, and
  // differs per browser. Measuring beats guessing. Skipped while an input has
  // focus so the on-screen keyboard doesn't make the layout jump mid-typing.
  function medirAlto() {
    if (document.activeElement && document.activeElement.tagName === "INPUT") return;
    const h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    document.documentElement.style.setProperty("--alto-app", Math.round(h) + "px");
  }
  medirAlto();
  window.addEventListener("resize", medirAlto);
  window.addEventListener("orientationchange", () => setTimeout(medirAlto, 250));
  if (window.visualViewport) window.visualViewport.addEventListener("resize", medirAlto);
  window.addEventListener("pageshow", medirAlto);
  // Belt and braces: some browsers resize the viewport without firing 'resize'
  // (and the address bar sliding away is exactly that case).
  if (window.ResizeObserver) new ResizeObserver(medirAlto).observe(document.documentElement);

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {
        /* no offline shell; the app still runs */
      });
    });
  }

  /* ---------------- data ---------------- */
  /* PARTIAL catalogue. Prices below come from the Colmado ASOVIME wall sign
     dated 20-04-2026 — real, but four months old, so worth re-checking.
     STILL INVENTED: café, papel higiénico, pasta dental, lentes de lectura. Oil is three separate products because three
     sizes means three prices and three stock counts, not one item with a note.
     Weighed goods step by 0.5; everything else by 1. */
  const PRODUCTS = [
    // ---- comida y bebida ----
    { id:"huevos",   nombre:"Huevos",            unidad:"huacal", precio:200, entrada:"stepper", grupo:"comida" },
    { id:"arroz",    nombre:"Arroz",             unidad:"libra",  precio:45,  entrada:"decimal", grupo:"comida" },
    { id:"habich",   nombre:"Habichuelas",       unidad:"libra",  precio:70,  entrada:"decimal", grupo:"comida" },
    { id:"habitas",  nombre:"Habitas",           unidad:"libra",  precio:45,  entrada:"decimal", grupo:"comida" },
    { id:"leche",    nombre:"Leche",             unidad:"litro",  precio:100,  entrada:"stepper", grupo:"comida" },
    { id:"cafe",     nombre:"Café",              unidad:"libra",  precio:250, entrada:"decimal", grupo:"comida" },
    { id:"aceite8",  nombre:"Aceite 8 oz",       unidad:"unidad", precio:55,  entrada:"stepper", grupo:"comida" },
    { id:"aceite16", nombre:"Aceite 16 oz",      unidad:"unidad", precio:100, entrada:"stepper", grupo:"comida" },
    { id:"aceitemg", nombre:"Aceite medio galón",unidad:"unidad", precio:320, entrada:"stepper", grupo:"comida" },
    { id:"gviva",    nombre:"Galleta Viva",      unidad:"unidad", precio:15,  entrada:"stepper", grupo:"comida" },
    { id:"ghatuey",  nombre:"Galleta Hatuey",    unidad:"unidad", precio:10,  entrada:"stepper", grupo:"comida" },
    { id:"maniverde", nombre:"Maní verde",  unidad:"unidad", precio:15, entrada:"stepper", grupo:"comida", color:"#2E9E5B" },
    { id:"maniazul",  nombre:"Maní azul",   unidad:"unidad", precio:15, entrada:"stepper", grupo:"comida", color:"#2F6FD0" },
    { id:"manimor",   nombre:"Maní morado", unidad:"unidad", precio:15, entrada:"stepper", grupo:"comida", color:"#8250C4" },
    // ---- otros ----
    { id:"papel",    nombre:"Papel higiénico",   unidad:"unidad", precio:30,  entrada:"stepper", grupo:"otros" },
    { id:"pasta",    nombre:"Pasta dental",      unidad:"unidad", precio:85,  entrada:"stepper", grupo:"otros" },
    { id:"lentes",   nombre:"Lentes de lectura", unidad:"unidad", precio:250, entrada:"stepper", grupo:"otros" }
  ];


  const PATIENTS = [
    { cedula:"402-1938291-4821", nombre:"María Rodríguez",     carry:710, saldo:200,  cuota:1500 },
    { cedula:"001-7729183-1093", nombre:"José Almonte",        carry:340, saldo:500,  cuota:1500 },
    { cedula:"402-8871209-7756", nombre:"Altagracia Peña",     carry:0,   saldo:1200, cuota:1500 },
    { cedula:"001-3320918-3312", nombre:"Ramón Díaz",          carry:880, saldo:0,    cuota:500  },
    { cedula:"402-1122934-5560", nombre:"Mariela Santana",     carry:120, saldo:300,  cuota:1500 }
  ];

  /* Loaded each morning by clinic staff, who know who is coming.
     A volunteer taps a name; typing is only for the unexpected walk-in. */
  const LISTA_HOY = [
    "402-1938291-4821", "001-7729183-1093", "402-8871209-7756",
    "001-3320918-3312", "402-1122934-5560"
  ];

  const VOLUNTEERS = [
    { id: "roselio", nombre: "Roselio Matos",    rol: "venta" },
    { id: "dorothy", nombre: "Dorothy Jiménez",  rol: "venta" },
    { id: "vidal",   nombre: "Vidal Ureña",      rol: "venta" },
    { id: "dolores", nombre: "Dolores Castillo", rol: "venta" },
    { id: "reina",   nombre: "Reina (recepción)", rol: "recepcion" }
  ];

  const MOSTRAR_GRUPOS = false;   // revisit once the full catalogue is known

  const DENOMS = [2000, 1000, 500, 200, 100, 50, 25, 10, 5, 1];

  /* One counter, used to open the caja chica and to close it out. Namespaced so
     the two counts never touch each other. */
  function contador(conteo, ns) {
    return `<div class="denoms">
      ${DENOMS.filter(d => d >= 5).map(d => {
        const n = conteo[d] || 0;
        return `<div class="denom">
          <span class="face">${d}</span>
          <span class="stepper">
            <button data-dmin="${ns}:${d}" ${n <= 0 ? "disabled" : ""} aria-label="Menos de ${d}">−</button>
            <input class="qtyin tnum" type="text" inputmode="numeric" maxlength="3"
                   data-dset="${ns}:${d}" value="${n}" aria-label="Cuántos de ${d}">
            <button data-dmas="${ns}:${d}" aria-label="Más de ${d}">+</button>
          </span>
          <span class="sum" data-sum="${ns}:${d}">${n ? plain(n * d) : ""}</span>
        </div>`;
      }).join("")}
    </div>`;
  }

  /* Typing updates the sums in place. A full re-render would tear the input out
     of the DOM mid-keystroke and drop the keyboard on a phone. */
  function refrescarConteo(ns) {
    const conteo = ns === "ini" ? S.conteoInicial : S.conteo;
    const total = sumar(conteo);
    if (ns === "ini") S.inicial = total; else S.contado = total;

    DENOMS.filter(d => d >= 5).forEach(d => {
      const cel = document.querySelector(`[data-sum="${ns}:${d}"]`);
      if (cel) cel.textContent = conteo[d] ? plain(conteo[d] * d) : "";
      const menos = document.querySelector(`[data-dmin="${ns}:${d}"]`);
      if (menos) menos.disabled = !conteo[d];
    });

    [el("total-" + ns), el("total-" + ns + "-fijo")].forEach(n => {
      if (n) n.textContent = money(total);
    });

    if (ns === "cie") {
      const v = el("variance");
      if (v) {
        const diff = S.contado - (S.inicial + S.ventas.reduce((a, x) => a + x.total, 0));
        v.className = "variance " + (diff === 0 ? "zero" : "off");
        v.innerHTML = `<span>${diff === 0 ? "Cuadra exacto" : diff > 0 ? "Sobra" : "Falta"}</span>
                       <span class="v">${diff === 0 ? "—" : money(Math.abs(diff))}</span>`;
      }
    }
    guardar();
  }

  const sumar = conteo => DENOMS.reduce((a, d) => a + (conteo[d] || 0) * d, 0);

  /* Which notes to hand back. Removes the mental arithmetic that loses cash. */
  function desglose(monto) {
    const out = [];
    let resto = Math.round(monto);
    for (const d of DENOMS) {
      const n = Math.floor(resto / d);
      if (n > 0) { out.push({ d, n }); resto -= n * d; }
    }
    return out;
  }

  const iniciales = nombre =>
    (nombre.match(/[\p{L}]+/gu) || []).slice(0, 2).map(w => w[0].toUpperCase()).join("");

  /* ---------------- state ---------------- */
  const S = {
    screen: "abrir",
    vol: null,
    offline: false,
    pendientes: 0,
    patient: null,
    query: "",
    buscando: false,          // search is the exception now, not the default
    atendidos: {},            // cedula -> true, set by completing a sale
    cart: {},              // id -> cantidad
    verTodos: false,
    efectivo: 500,
    donacion: 0,
    lastSale: null,        // { total, antes, ahora, earned, saldo, carry }
    contado: 0,
    conteo: {},        // cierre:  denominación -> cantidad contada
    conteoInicial: {}, // apertura: el fondo con que se abre la caja
    inicial: 0,
    canjeApplied: false,
    canjePatient: PATIENTS[0],
    ventas: []           // this shift's sales, for the close-out
  };

  /* Bar 1 runs entirely on the phone: no server, no network. State lives in
     localStorage so a shift survives the app being closed, backgrounded, or the
     phone locking — which is what a real day looks like. */
  const CLAVE = "colmado.demo.v1";
  const CLAVE_DISPOSITIVO = "colmado.dispositivo";   // survives a demo reset

  const CLAVE_TEXTO = "colmado.texto";
  const textoGrande = () => { try { return localStorage.getItem(CLAVE_TEXTO) === "grande"; } catch (e) { return false; } };
  function aplicarTexto() {
    document.documentElement.dataset.texto = textoGrande() ? "grande" : "normal";
  }

  const dueno = () => { try { return localStorage.getItem(CLAVE_DISPOSITIVO); } catch (e) { return null; } };
  const setDueno = id => { try { localStorage.setItem(CLAVE_DISPOSITIVO, id); } catch (e) {} };

  function guardar() {
    try {
      localStorage.setItem(CLAVE, JSON.stringify({
        screen: S.screen, vol: S.vol, patient: S.patient && S.patient.cedula,
        cart: S.cart, verTodos: S.verTodos, buscando: S.buscando,
        atendidos: S.atendidos, conteo: S.conteo, contado: S.contado,
        donacion: S.donacion, lastSale: S.lastSale, offline: S.offline, pendientes: S.pendientes,
        ventas: S.ventas, canjeApplied: S.canjeApplied,
        saldos: PATIENTS.map(p => [p.cedula, p.saldo, p.carry])
      }));
    } catch (e) { /* private mode, full disk — the app still works, it just forgets */ }
  }

  function restaurar() {
    let d; try { d = JSON.parse(localStorage.getItem(CLAVE) || "null"); } catch (e) { return; }
    if (!d) return;
    Object.assign(S, {
      screen: d.screen || "abrir", vol: d.vol || null, cart: d.cart || {},
      verTodos: !!d.verTodos, buscando: !!d.buscando, atendidos: d.atendidos || {},
      donacion: d.donacion || 0,
      conteo: d.conteo || {}, contado: d.contado || 0,
      conteoInicial: d.conteoInicial || {}, inicial: d.inicial || 0, lastSale: d.lastSale || null,
      offline: !!d.offline, pendientes: d.pendientes || 0, ventas: d.ventas || [],
      canjeApplied: !!d.canjeApplied
    });
    if (d.patient) S.patient = PATIENTS.find(p => p.cedula === d.patient) || null;
    (d.saldos || []).forEach(([c, sal, car]) => {
      const p = PATIENTS.find(x => x.cedula === c);
      if (p) { p.saldo = sal; p.carry = car; }
    });
  }

  const money = n => "RD$ " + Number(n).toLocaleString("es-DO", { maximumFractionDigits: 2 });
  const plain = n => Number(n).toLocaleString("es-DO", { maximumFractionDigits: 2 });
  const el = document.getElementById.bind(document);

  const lines = () => Object.entries(S.cart)
    .filter(([, q]) => q > 0)
    .map(([id, q]) => {
      const p = PRODUCTS.find(x => x.id === id);
      return { p, cantidad: q, subtotal: Math.round(p.precio * q * 100) / 100 };
    });
  const total = () => lines().reduce((a, l) => a + l.subtotal, 0);

  /* The switcher can land on Confirmar or Recibo before a sale exists.
     Seed a plausible one so the screen is reviewable instead of blank. */
  function seedSale() {
    if (!S.patient) S.patient = PATIENTS[0];
    if (total() <= 0) S.cart = { arroz: 2, huevos: 1 };
  }
  function seedRecibo() {
    seedSale();
    const tot = total();
    const res = aplicarCredito(S.patient.carry, S.patient.saldo, tot);
    S.lastSale = { total: tot, antes: S.patient.carry, earned: res.earned,
                   saldo: res.saldo, carry: res.carry, nombre: S.patient.nombre };
  }

  /* §6.1 — the real algorithm */
  function aplicarCredito(carry, saldo, monto) {
    let c = carry + monto;
    const earned = Math.floor(c / 1000);
    c = c - earned * 1000;
    return { carry: c, saldo: saldo + earned * 100, earned };
  }

  /* ---------------- screens ---------------- */
  const SCREENS = {
    abrir:   { label: "Abrir turno",  who: "Comedero",            action: "" },
    venta:   { label: "Venta",        who: "Comedero · Roselio",  action: "Cerrar" },
    confirm: { label: "Confirmar",    who: "Comedero · Roselio",  action: "" },
    recibo:  { label: "Recibo",       who: "Comedero · Roselio",  action: "" },
    cerrar:  { label: "Cerrar turno", who: "Comedero · Roselio",  action: "" },
    canje:   { label: "Recepción",    who: "Comedero · Recepción",action: "" }
  };

  let _pantallaPrevia = null;

  function render() {
    const body = el("screenbody");

    // Two different behaviours, and getting them backwards is confusing either way:
    //  - a NEW screen must start at the top;
    //  - a re-render of the SAME screen (tapping + on a product far down the list)
    //    must stay exactly where the volunteer was looking.
    const cambioDePantalla = S.screen !== _pantallaPrevia;
    const anterior = body.querySelector(".scroll");
    const desplazamiento = anterior ? anterior.scrollTop : 0;

    body.innerHTML = "";
    const s = SCREENS[S.screen];
    const v = VOLUNTEERS.find(x => x.id === S.vol);
    el("appbar-who").textContent = v ? "Comedero · " + v.nombre.split(" ")[0] : s.who;
    const act = el("appbar-action");
    act.textContent = s.action;
    act.style.visibility = s.action ? "visible" : "hidden";
    el("netlabel").textContent = S.offline ? "sin conexión · 89%" : "wifi · 89%";

    if (S.offline && S.pendientes > 0 && S.screen !== "abrir") {
      body.insertAdjacentHTML("beforeend",
        `<div class="banner"><span class="dot"></span>${S.pendientes} venta${S.pendientes > 1 ? "s" : ""} sin enviar</div>`);
    }
    try {
      VIEWS[S.screen](body);
    if (S.buscando) body.insertAdjacentHTML("beforeend", hojaBusqueda());
    } catch (err) {
      body.insertAdjacentHTML("beforeend",
        `<div class="note" style="padding:24px 16px">No se pudo mostrar esta pantalla.
         <br><span style="font-family:var(--mono);font-size:11px">${err.message}</span></div>`);
    }
    const zona = body.querySelector(".scroll");
    if (cambioDePantalla) {
      if (zona) zona.scrollTop = 0;
      window.scrollTo(0, 0);          // the review page scrolls the window, not .scroll
      _pantallaPrevia = S.screen;
    } else if (zona) {
      zona.scrollTop = desplazamiento;
    }

    paintSwitcher();
    paintNotes();
    guardar();
  }

  const VIEWS = {};

  /* A sheet rather than a field tucked above the product list: the list is long,
     re-renders keep their scroll position, and a volunteer who taps "buscar"
     would otherwise be looking at rice. Covering the screen removes the
     question of where the field went. */
  function hojaBusqueda() {
    const q = S.query.trim().toLowerCase();
    let cuerpo;
    if (q.length >= 3) {
      const hits = PATIENTS.filter(p =>
        p.nombre.toLowerCase().includes(q) || p.cedula.replace(/-/g, "").includes(q)
      ).slice(0, 5);
      cuerpo = hits.length
        ? `<div class="daylist">${hits.map(p => `
            <button class="pcard" data-pat="${p.cedula}">
              <span class="ini">${iniciales(p.nombre)}</span>
              <span><span class="nm">${p.nombre}</span><br>
                    <span class="sub">…${p.cedula.slice(-4)}</span></span>
            </button>`).join("")}</div>`
        : `<div class="note">Ningún paciente con ese nombre o cédula.</div>`;
    } else {
      cuerpo = `<div class="note">Escriba al menos 3 letras del nombre, o los números de la cédula.</div>`;
    }
    return `
      <div class="hoja">
        <div class="hoja-top">
          <div class="sect-label" style="margin-bottom:8px">Buscar paciente</div>
          <input type="text" id="q" value="${S.query}" autocomplete="off"
                 placeholder="nombre o cédula" aria-label="Buscar paciente">
        </div>
        <div class="hoja-cuerpo">${cuerpo}</div>
        <div class="foot"><button class="btn ghost" data-buscar="0">Cancelar</button></div>
      </div>`;
  }

  /* ---- abrir turno ---- */
  VIEWS.abrir = function (b) {
    const mio = VOLUNTEERS.find(v => v.id === dueno());

    // Known phone: one tap to open the shift. Nothing typed, nothing recalled.
    if (mio) {
      b.insertAdjacentHTML("beforeend", `
        <div class="scroll">
          <div class="sect" style="padding-top:12px;padding-bottom:12px">

              ${textoGrande() ? "Letra normal" : "Letra más grande"}</button>
          </div>
          <div class="sect" style="border-bottom:0;padding-bottom:4px">
            <div style="display:flex;align-items:center;justify-content:center;gap:10px">
              <span class="ini" style="width:38px;height:38px;font-size:14px">${iniciales(mio.nombre)}</span>
              <div style="font-size:16px;font-weight:600;letter-spacing:-.005em">Hola, ${mio.nombre.split(" ")[0]}</div>
            </div>
          </div>

            <div class="sect-label">Cuenta el fondo de la caja</div>

            </div>
          </div>
          <div class="note" style="text-align:center;display:flex;flex-direction:column;gap:10px">
            <button data-otro="1" style="background:none;border:0;color:var(--brand);font:inherit;
              font-size:calc(var(--esc)*15px);text-decoration:underline;cursor:pointer">No soy ${mio.nombre.split(" ")[0]}</button>
            <button data-reset-demo="1" style="background:none;border:0;color:var(--ink-3);font:inherit;
              font-size:12px;text-decoration:underline;cursor:pointer">Reiniciar la demostración</button>
          </div>
        </div>
        <div class="foot">
          <div class="fijo"><span class="k">Abres con</span>

        </div>`);
      S.vol = mio.id;

    }

    // First run on this phone only: who does it belong to?
    b.insertAdjacentHTML("beforeend", `
      <div class="scroll">
        <div class="sect">
          <div class="sect-label">¿De quién es este teléfono?</div>

            Se pregunta una sola vez. Después el teléfono ya sabe quién eres.
          </div>
        </div>
      </div>

        <button class="btn" data-soy="1" ${S.vol ? "" : "disabled"}>CONTINUAR</button>
      </div>`);
  };

  /* ---- venta ---- */
  VIEWS.venta = function (b) {
    const t = total();
    // With a catalogue this short, hiding half of it behind a button costs more
    // than it saves. The split stays in the code for if it ever grows.
    const CORTO = PRODUCTS.length <= 18;
    const shown = (CORTO || S.verTodos) ? PRODUCTS : PRODUCTS.filter(p => p.top);

    let patientHTML;
    if (S.patient) {
      patientHTML = `<div class="chosen">
          <span><b>${S.patient.nombre}</b> <span class="ced" style="color:var(--ink-3);font-size:13px">…${S.patient.cedula.slice(-4)}</span></span>
          <button class="swap" data-clear="1">Cambiar</button>
        </div>`;
    } else {
      const hoy = LISTA_HOY.map(c => PATIENTS.find(p => p.cedula === c))
        .sort((a, b) => (S.atendidos[a.cedula] ? 1 : 0) - (S.atendidos[b.cedula] ? 1 : 0));
      const faltan = hoy.filter(p => !S.atendidos[p.cedula]).length;
      patientHTML = `
        <div class="listhead">
          <span class="sect-label" style="margin:0">Pacientes de hoy</span>
          <span class="count">${faltan} sin atender</span>
        </div>
        <div class="daylist">
          ${hoy.map(p => {
            const done = !!S.atendidos[p.cedula];
            return `<button class="pcard ${done ? "done" : ""}" data-pat="${p.cedula}">
                      <span class="ini">${iniciales(p.nombre)}</span>
                      <span>
                        <span class="nm">${p.nombre}</span><br>
                        <span class="sub">…${p.cedula.slice(-4)}</span>
                      </span>
                      ${done ? '<span class="tick" title="Ya compró hoy">✓</span>' : ""}
                    </button>`;
          }).join("")}
        </div>
        <button class="searchtoggle" data-buscar="1">Buscar otro paciente</button>`;
    }

    b.insertAdjacentHTML("beforeend", `
      <div class="scroll">
        <div class="sect">
          <div class="sect-label">Paciente</div>
          ${patientHTML}
        </div>
        <div id="plist">
          ${shown.map((p, i) => {
            const q = S.cart[p.id] || 0;
            // One control for everything. entrada only decides the step: weighed
            // goods move by 0.5, countables by 1. Nothing is ever typed.
            const ctrl = `<div class="stepper">

                 </div>`;
            const cabecera = (MOSTRAR_GRUPOS && i > 0 && shown[i - 1].grupo !== p.grupo)
              ? `<div class="grupo">Otros</div>` : "";
            return `${cabecera}<div class="prow ${q > 0 ? "active" : ""}">
                      <div><div class="pname">${p.color
                          ? `<span class="swatch" style="background:${p.color}"></span>` : ""}${p.nombre}</div>
                        <div class="punit">${p.unidad}</div></div>
                      ${ctrl}
                    </div>`;
          }).join("")}
          ${CORTO ? "" : `<button class="vertodos" data-toggle-todos="1">
            ${S.verTodos ? "Ver menos" : `Ver todos (${PRODUCTS.length})`}
          </button>`}
        </div>
      </div>
      <div class="foot">
        <div class="totalrow">
          <span class="lbl">Total ${S.offline ? '<span class="approx">aprox.</span>' : ""}</span>
          <span class="amt">${money(t)}</span>
        </div>
        <button class="btn" data-go="confirm" ${(!S.patient || t <= 0) ? "disabled" : ""}>COBRAR</button>
      </div>`);
  };

  /* ---- confirmar ---- */

    b.insertAdjacentHTML("beforeend", `
      <div class="scroll">

            ${S.donacion > 0 ? `<button data-don="0" class="quitar">Quitar</button>` : ""}
          </div>
        </div>
        <div class="sect" style="border-bottom:0">
          ${S.donacion > 0 ? `<div class="kv"><span class="k">Donación</span>
             <span class="v">${money(S.donacion)}</span></div>` : ""}
          <div class="kv big"><span class="k"><b>A cobrar</b></span>

        </div>
      </div>`);
  };

  /* ---- recibo ---- */
  VIEWS.recibo = function (b) {

      <div class="scroll">

        <div class="creditbox">

            <div><span>Antes tenía</span><b>${money(r.antes)} acumulado</b></div>

  /* ---- cerrar turno ---- */

  /* ---- recepción: canje ---- */

    canje: { h: "Recepción — §7.6", items: [
      "Credit offsets the monthly cuota, so this happens once a month, not once a visit. The month is part of the key.",
      "Applied credit is capped at the cuota; the surplus rolls forward and never expires.",
      "Applying credit and taking payment are two separate acts — otherwise credit can be spent against a cuota nobody ever paid."
    ]}
  };

  function paintNotes() {
    const n = NOTES[S.screen];
    el("notes").innerHTML = `
      <div class="notecard">
        <div class="ref">Pantalla</div>
        <h3>${n.h}</h3>
        <ul>${n.items.map(i => `<li>${i}</li>`).join("")}</ul>
      </div>
      <div class="notecard">
        <div class="ref">Nota</div>
        <ul><li>All copy is Spanish, as the spec requires. The English here is annotation for review only — none of it appears in the app.</li></ul>
      </div>`;
  }

  function paintSwitcher() {
    el("switcher").innerHTML = Object.entries(SCREENS)
      .map(([k, v]) => `<button data-screen="${k}" aria-current="${k === S.screen}">${v.label}</button>`).join("");
  }

  /* ---------------- events ---------------- */
  document.addEventListener("click", function (e) {
    const t = e.target.closest("button, .result");
    if (!t) return;

    if (t.dataset.screen) {
      const k = t.dataset.screen;
      if (k === "confirm") seedSale();
      if (k === "recibo")  seedRecibo();
      S.screen = k;
      return render();
    }
    if (t.dataset.go)      { S.screen = t.dataset.go; return render(); }
    if (t.dataset.vol)     { S.vol = t.dataset.vol; return render(); }
    if (t.dataset.soy)  { setDueno(S.vol); return render(); }
    if (t.dataset.otro) {
      try { localStorage.removeItem(CLAVE_DISPOSITIVO); } catch (e) {}
      S.vol = null; return render();
    }
    if (t.dataset.entrar) {
      const v = VOLUNTEERS.find(x => x.id === S.vol);
      S.screen = v && v.rol === "recepcion" ? "canje" : "venta";
      return render();
    }
    if (t.dataset.texto) {
      try { localStorage.setItem(CLAVE_TEXTO, textoGrande() ? "normal" : "grande"); } catch (e) {}
      aplicarTexto();
      return render();
    }
    if (t.dataset.resetDemo) {
      try { localStorage.removeItem(CLAVE); } catch (e) {}
      return location.reload();
    }
    if (t.id === "appbar-action") { S.screen = "cerrar"; return render(); }
    if (t.dataset.pat) {
      S.patient = PATIENTS.find(p => p.cedula === t.dataset.pat);
      S.query = ""; S.buscando = false;
      return render();
    }
    if (t.dataset.clear)   { S.patient = null; return render(); }
    if (t.dataset.toggleTodos) { S.verTodos = !S.verTodos; return render(); }
    if (t.dataset.buscar !== undefined) {
      S.buscando = t.dataset.buscar === "1";
      S.query = "";
      render();
      const campo = el("q");
      if (campo) campo.focus();
      return;
    }
    if (t.dataset.don !== undefined) {
      const v = Number(t.dataset.don);
      S.donacion = v === 0 ? 0 : S.donacion + v;
      return render();
    }
    if (t.dataset.dmas || t.dataset.dmin) {
      const [ns, d] = (t.dataset.dmas || t.dataset.dmin).split(":");
      const step = t.dataset.dmas ? 1 : -1;
      const conteo = ns === "ini" ? S.conteoInicial : S.conteo;
      conteo[d] = Math.max(0, (conteo[d] || 0) + step);
      if (ns === "ini") S.inicial = sumar(conteo); else S.contado = sumar(conteo);
      return render();
    }

    if (t.dataset.inc) {
      const p = PRODUCTS.find(x => x.id === t.dataset.inc);
      const step = p.entrada === "decimal" ? 0.5 : 1;
      S.cart[p.id] = Math.round(((S.cart[p.id] || 0) + step) * 100) / 100;
      return render();
    }
    if (t.dataset.dec) {
      const p = PRODUCTS.find(x => x.id === t.dataset.dec);
      const step = p.entrada === "decimal" ? 0.5 : 1;
      S.cart[p.id] = Math.max(0, Math.round(((S.cart[p.id] || 0) - step) * 100) / 100);
      return render();
    }

    if (t.dataset.commit) {
      const tot = total();
      const before = S.patient.carry;
      const res = aplicarCredito(S.patient.carry, S.patient.saldo, tot);
      S.patient.carry = res.carry;
      S.patient.saldo = res.saldo;
      S.lastSale = { total: tot, antes: before, earned: res.earned, donacion: S.donacion,
                     saldo: res.saldo, carry: res.carry, nombre: S.patient.nombre };
      S.atendidos[S.patient.cedula] = true;
      S.ventas.push({ id: "s" + Date.now(), total: tot, donacion: S.donacion, cedula: S.patient.cedula });
      S.donacion = 0;
      if (S.offline) S.pendientes++;
      S.screen = "recibo";
      return render();
    }
    if (t.dataset.cerrarTurno) {
      S.screen = "abrir"; S.ventas = []; S.atendidos = {};
      S.conteo = {}; S.contado = 0; S.cart = {}; S.patient = null;
      return render();
    }
    if (t.dataset.nueva)  {
      S.cart = {}; S.patient = null; S.verTodos = false; S.buscando = false;
      S.screen = "venta"; return render();
    }
    if (t.dataset.anular) {
      const r = S.lastSale;
      S.patient = PATIENTS.find(p => p.nombre === r.nombre);
      S.patient.carry = r.antes;                       // rebuild_credit, §6.2
      S.patient.saldo = r.saldo - r.earned * 100;
      delete S.atendidos[S.patient.cedula];
      S.ventas = S.ventas.filter(v => v.total !== r.total || v.cedula !== S.patient.cedula);
      if (S.offline && S.pendientes > 0) S.pendientes--;
      S.buscando = false;
      S.screen = "venta";
      return render();
    }
    if (t.dataset.aplicar) {
      const p = S.canjePatient;
      p.saldo = p.saldo - Math.min(p.saldo, p.cuota);
      S.canjeApplied = true;
      return render();
    }
    if (t.dataset.pagar) { S.canjeApplied = false; S.screen = "canje"; return render(); }
  });

  // Tapping the number selects it, so typing replaces rather than appends to "0".
  document.addEventListener("focusin", function (e) {
    if (e.target.dataset && e.target.dataset.dset) e.target.select();
  });

  document.addEventListener("input", function (e) {
    const t = e.target;
    if (t.dataset.donset) {
      S.donacion = Math.max(0, parseInt(t.value.replace(/\D/g, ""), 10) || 0);
      const caja = document.querySelectorAll(".kv.big .v");
      if (caja.length) caja[caja.length - 1].textContent = money(total() + S.donacion);
      guardar();
      return;
    }
    if (t.dataset.dset) {
      const [ns, d] = t.dataset.dset.split(":");
      const conteo = ns === "ini" ? S.conteoInicial : S.conteo;
      const n = Math.max(0, parseInt(t.value.replace(/\D/g, ""), 10) || 0);
      conteo[d] = n;
      if (t.value !== String(n) && t.value !== "") t.value = n;
      return refrescarConteo(ns);
    }
    if (t.id === "q") {
      S.query = t.value;
      const cuerpo = document.querySelector(".hoja-cuerpo");
      if (cuerpo) {                       // patch results only; never touch the field
        const tmp = document.createElement("div");
        tmp.innerHTML = hojaBusqueda();
        cuerpo.innerHTML = tmp.querySelector(".hoja-cuerpo").innerHTML;
        guardar();
        return;
      }
      return render();
    }
    if (t.id === "efectivo") {
      S.efectivo = parseFloat(t.value.replace(/[^\d.]/g, "")) || 0;
      const pos = t.selectionStart; render();
      const box = el("efectivo"); if (box) { box.focus(); box.setSelectionRange(pos, pos); }
      return;
    }
  });

  el("tg-offline").addEventListener("click", function () {
    S.offline = !S.offline;
    this.setAttribute("aria-pressed", String(S.offline));
    this.textContent = S.offline ? "Restablecer energía" : "Simular corte de energía";
    if (!S.offline) S.pendientes = 0;
    render();
  });
  el("tg-reset").addEventListener("click", function () {
    S.cart = {}; S.patient = null; S.verTodos = false; S.pendientes = 0;
    S.buscando = false; S.atendidos = {}; S.conteo = {}; S.contado = 0;
    S.conteoInicial = {}; S.inicial = 0;
    PATIENTS[0].carry = 710; PATIENTS[0].saldo = 200;
    PATIENTS[1].carry = 340; PATIENTS[1].saldo = 500;
    PATIENTS[2].carry = 0;   PATIENTS[2].saldo = 1200;
    PATIENTS[3].carry = 880; PATIENTS[3].saldo = 0;
    PATIENTS[4].carry = 120; PATIENTS[4].saldo = 300;
    S.canjeApplied = false; S.screen = "venta";
    render();
  });

  aplicarTexto();
  restaurar();
  render();
})();
</script>
</body>
</html>
